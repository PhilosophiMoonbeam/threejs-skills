<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Three.js Skills for Agents</title>
  <desc id="logo-description">A geometric four-face spatial mark beside the words Three.js Skills and For Agents, in a warm technical palette.</desc>

  <!-- The paper-colored field keeps the lockup legible on both light and dark surfaces. -->
  <rect x="24" y="24" width="1552" height="592" rx="42" fill="#F7F0DF" stroke="#15253D" stroke-width="8"/>
  <path d="M72 102H1528" fill="none" stroke="#D8CCB5" stroke-width="3"/>
  <path d="M72 538H1528" fill="none" stroke="#D8CCB5" stroke-width="3"/>

  <!-- Utopian scholastic registration marks. -->
  <g fill="none" stroke="#15253D" stroke-width="6" stroke-linecap="square">
    <path d="M72 76v26M59 89h26"/>
    <path d="M1528 76v26M1515 89h26"/>
    <path d="M72 538v26M59 551h26"/>
    <path d="M1528 538v26M1515 551h26"/>
  </g>

  <!-- Primary spatial mark: an original, four-face octahedral construction. -->
  <g transform="translate(320 320)">
    <rect x="-224" y="-224" width="448" height="448" rx="30" fill="#15253D"/>
    <path d="M0 -190L190 -80L190 140L0 190L-190 140L-190 -80Z" fill="none" stroke="#F7F0DF" stroke-width="4" opacity="0.48"/>
    <path d="M0 -184L168 0L0 184L-168 0Z" fill="#69C8B8" stroke="#F7F0DF" stroke-width="11" stroke-linejoin="round"/>
    <path d="M0 -184L168 0H0Z" fill="#F17658" stroke="#15253D" stroke-width="9" stroke-linejoin="round"/>
    <path d="M168 0L0 184V0Z" fill="#F3C95D" stroke="#15253D" stroke-width="9" stroke-linejoin="round"/>
    <path d="M0 184L-168 0H0Z" fill="#54A9D6" stroke="#15253D" stroke-width="9" stroke-linejoin="round"/>
    <path d="M-168 0L0 -184V0Z" fill="#E7E0CD" stroke="#15253D" stroke-width="9" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="18" fill="#15253D" stroke="#F7F0DF" stroke-width="7"/>
    <path d="M0 -212V-184M212 0H168M0 212V184M-212 0H-168" fill="none" stroke="#F7F0DF" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="-212" r="7" fill="#F17658"/>
    <circle cx="212" cy="0" r="7" fill="#F3C95D"/>
    <circle cx="0" cy="212" r="7" fill="#54A9D6"/>
    <circle cx="-212" cy="0" r="7" fill="#69C8B8"/>
  </g>

  <!-- Wordmark and revision cue. -->
  <path d="M600 136V504" fill="none" stroke="#D8CCB5" stroke-width="4"/>
  <g fill="#15253D" font-family="Arial, Helvetica, sans-serif">
    <text x="660" y="166" font-size="22" font-weight="700" letter-spacing="3">OPEN GEOMETRY / PRACTICAL 3D</text>
    <text x="660" y="304" font-size="74" font-weight="800" letter-spacing="1">THREE.JS SKILLS</text>
    <text x="660" y="408" font-size="74" font-weight="800" letter-spacing="2">FOR AGENTS</text>
  </g>
  <path d="M660 452H1360" fill="none" stroke="#15253D" stroke-width="8"/>
  <path d="M660 452H850" fill="none" stroke="#F17658" stroke-width="8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#15253D">
    <text x="660" y="493" font-size="24" font-weight="700" letter-spacing="2">three@0.185.1</text>
    <text x="1002" y="493" font-size="24" font-weight="700" letter-spacing="2">REVISION 185</text>
  </g>

  <!-- Cassette-futurist calibration strip. -->
  <g transform="translate(1496 146)">
    <rect width="40" height="270" rx="8" fill="#15253D"/>
    <rect x="10" y="18" width="20" height="34" rx="4" fill="#F17658"/>
    <rect x="10" y="77" width="20" height="34" rx="4" fill="#F3C95D"/>
    <rect x="10" y="136" width="20" height="34" rx="4" fill="#69C8B8"/>
    <rect x="10" y="195" width="20" height="34" rx="4" fill="#54A9D6"/>
  </g>
  <text x="1516" y="466" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#15253D">01 / 01</text>
</svg>
